<!DOCTYPE html>

<html lang="tr">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - Bosphorus Travel</title>

<link rel="stylesheet" href="assets/css/style.css">

<style>

.gallery-title{
    text-align:center;
    margin-top:180px;
    margin-bottom:40px;
    font-size:42px;
}

.gallery{
    max-width:1400px;
    margin:auto;
    padding:20px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
}

.gallery img{
    width:100%;
    height:320px;
    object-fit:cover;
    border-radius:16px;
}

.whatsapp-btn{
    display:block;
    width:fit-content;
    margin:50px auto;
    padding:18px 35px;
    background:#25D366;
    color:white;
    text-decoration:none;
    border-radius:12px;
    font-size:20px;
    font-weight:bold;
}

</style>

</head>
