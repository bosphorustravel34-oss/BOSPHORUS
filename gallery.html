<!DOCTYPE html>

<html lang="tr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - Bosphorus Travel</title>

<link rel="stylesheet" href="assets/css/style.css">

<style>

.gallery-title{
    text-align:center;
    margin-top:180px;
    margin-bottom:40px;
    font-size:42px;
}

.gallery{
    max-width:1400px;
    margin:auto;
    padding:20px;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
}

.gallery img{
    width:100%;
    height:320px;
    object-fit:cover;
    border-radius:16px;
}

.whatsapp-btn{
    display:block;
    width:fit-content;
    margin:50px auto;
    padding:18px 35px;
    background:#25D366;
    color:white;
    text-decoration:none;
    border-radius:12px;
    font-size:20px;
    font-weight:bold;
}

.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:9999;justify-content:center;align-items:center;}
.modal img{max-width:90%;max-height:90%;object-fit:contain;}
.close-btn,.prev-btn,.next-btn{position:absolute;color:#fff;cursor:pointer;user-select:none;}
.close-btn{top:20px;right:30px;font-size:50px;}
.prev-btn{left:20px;font-size:60px;}
.next-btn{right:20px;font-size:60px;}
.gallery img{cursor:pointer;}

</style>

</head>

<body>

<header>

<div class="logo">
<img src="assets/images/LOGO.png" alt="">
</div>

<div class="languages">
<button onclick="history.back()">← Back</button>
</div>

</header>

<h1 class="gallery-title" id="galleryTitle"></h1>

<div class="gallery" id="gallery"></div>

<a
class="whatsapp-btn"
href="https://wa.me/905421914498"

const gallery=document.getElementById("gallery");
const title=document.getElementById("galleryTitle");
let currentIndex = 0;
let currentImages = [];


title.textContent=category?.toUpperCase() || "Gallery";

if(data[category]){
currentImages = data[category];

data[category].forEach(src=>{

const img=document.createElement("img");
img.src=src;
img.onclick=()=>openModal(currentImages.indexOf(src));

gallery.appendChild(img);

});

}


function openModal(index){
currentIndex = index;
document.getElementById("imageModal").style.display = "flex";
document.getElementById("modalImage").src = currentImages[currentIndex];
}

function closeModal(){
document.getElementById("imageModal").style.display = "none";
}

function nextImage(){
currentIndex = (currentIndex + 1) % currentImages.length;
document.getElementById("modalImage").src = currentImages[currentIndex];
}

function prevImage(){
currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
document.getElementById("modalImage").src = currentImages[currentIndex];
}
